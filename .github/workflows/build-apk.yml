      - name: Sign and name the APK
        run: |
          APK=$(ls -1 bin/*.apk | head -n 1)
          echo "Собранный файл: $APK"
          APKSIGNER=$(find "$HOME/.buildozer/android/platform" -name apksigner -type f | sort | tail -n 1)
          echo "apksigner: $APKSIGNER"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" sign --ks game.keystore --ks-pass pass:mygames123 --key-pass pass:mygames123 --ks-key-alias mygames --out "$APK_NAME" "$APK"
          else
            cp "$APK" "$APK_NAME"
          fi
          ls -la "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Publish release (APK for the Steam app)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ${{ env.APP_TITLE }} (сборка ${{ github.run_number }})
          files: ${{ env.APK_NAME }}
