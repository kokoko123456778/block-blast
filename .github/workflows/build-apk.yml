name: build-apk

# Собирает APK игры Block Blast (pygame) через Buildozer и публикует его в Releases:
# из приложения «Игротека» его можно скачать одной кнопкой. Первая сборка идёт 20-30 минут.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_TITLE: Block Blast
  APP_NAME: blockblast
  APP_DOMAIN: com.kokoko
  APP_VERSION: "3.0"
  APK_NAME: BlockBlast.apk

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Prepare the game (main.py and buildozer.spec)
        run: |
          SRC=$(ls -1 block_blast*.py 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SRC" ]; then SRC=$(ls -1 *.py | grep -v '^main.py$' | sort -V | tail -n 1); fi
          echo "Файл игры: $SRC"
          cp "$SRC" main.py
          cat > buildozer.spec <<SPEC_EOF
          [app]
          title = $APP_TITLE
          package.name = $APP_NAME
          package.domain = $APP_DOMAIN
          source.dir = .
          source.include_exts = py,png,jpg,wav,ogg,mp3,json,ttf
          source.exclude_dirs = .git,.github,bin,.buildozer
          version = $APP_VERSION
          requirements = python3,pygame
          orientation = portrait
          fullscreen = 1
          android.api = 33
          android.minapi = 21
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.debug_artifact = apk
          [buildozer]
          log_level = 2
          warn_on_root = 0
          SPEC_EOF
          sed -i 's/^          //' buildozer.spec
          echo "----- buildozer.spec -----"; cat buildozer.spec

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" virtualenv

      - name: Build APK
        run: buildozer -v android debug

